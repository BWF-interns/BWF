<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BWF Admin — Student Census</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/staff.css"/>
<style>
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#a78bfa)}
.kpi-val{font-size:26px;font-weight:900;font-family:'Outfit',sans-serif;color:#f1f5f9;display:flex;align-items:baseline;gap:6px}
.kpi-sub{font-size:12px;font-weight:600;color:#94a3b8;font-family:'Inter',sans-serif}
.kpi-lbl{font-size:12px;color:#64748b;margin-top:4px}
.chart-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;margin-bottom:20px}
.chart-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#64748b;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-lbl{width:130px;text-align:right;font-size:11px;color:#64748b;flex-shrink:0}
.bar-track{flex:1;height:18px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-count{font-size:11px;color:#94a3b8;min-width:26px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">🌏</div><div class="logo-text"><h2>BWF Portal</h2><p style="font-size:10px;color:#a78bfa;font-weight:700;margin-top:2px">DEMO MODE</p></div></div>
    <div class="sidebar-staff"><div class="staff-card"><div class="staff-avatar" style="background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:13px;font-weight:800">RA</div><div class="staff-info"><h4>Ravi Admin</h4><p>Administrator</p></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="compliance.html" class="nav-link"><span class="nav-icon">🔒</span>DPDP Compliance</a>
      <a href="students.html"   class="nav-link active"><span class="nav-icon">👩‍🎓</span>Student Census</a>
      <a href="staff.html"      class="nav-link"><span class="nav-icon">👥</span>Staff Management</a>
      <a href="finance.html"    class="nav-link"><span class="nav-icon">💰</span>Finance</a>
      <a href="media.html"      class="nav-link"><span class="nav-icon">📸</span>Media Oversight</a>
    </nav>
    <div class="sidebar-bottom"><button class="logout-btn" onclick="window.location.href='../index.html'">🚪 Back to Portal</button></div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h1>👩‍🎓 Student Census</h1><p>Demographic distribution and welfare tracking</p></div>
      <div class="topbar-right"><span style="font-size:12px;color:#a78bfa;background:rgba(99,102,241,0.1);padding:4px 12px;border-radius:20px">🧪 Demo Mode</span></div>
    </header>
    <div class="page-content fade-in" id="page-content"><div style="text-align:center;padding:60px;color:#64748b">Loading...</div></div>
  </div>
</div>
<script src="../js/demo-data.js"></script>
<script>
async function init() {
  const [ov, welf] = await Promise.all([DemoAPI.overview(), DemoAPI.welfare()]);
  const max = (arr) => Math.max(...arr.map(x=>x.count));
  const renderChart = (title, items, color) => `
    <div class="chart-box">
      <div class="chart-title">${title}</div>
      ${items.map(i=>`<div class="bar-row">
        <span class="bar-lbl">${i._id}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((i.count/max(items))*100)}%;background:${color}"></div></div>
        <span class="bar-count">${i.count}</span>
      </div>`).join('')}
    </div>`;

  document.getElementById('page-content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${ov.data.totalStudents} <span class="kpi-sub">+0 this month</span></div><div class="kpi-lbl">Total Students</div></div>
      <div class="kpi-card"><div class="kpi-val">${welf.data.avgXP} <span class="kpi-sub">XP</span></div><div class="kpi-lbl">Avg Gamification Engagement</div></div>
      <div class="kpi-card"><div class="kpi-val">${welf.data.avgStreak} <span class="kpi-sub">days</span></div><div class="kpi-lbl">Average Login Streak</div></div>
    </div>
    <div class="grid-2">
      ${renderChart('📚 Program Enrollment', welf.data.byProgram, 'linear-gradient(90deg,#6366f1,#a78bfa)')}
      ${renderChart('🏠 Home Group Distribution', welf.data.byHomeGroup, '#6366f1')}
    </div>
    <div class="grid-3">
      ${renderChart('👥 Gender Profile', welf.data.byGender, '#10b981')}
      ${renderChart('📍 Origin Background', welf.data.byBackground, '#f59e0b')}
      ${renderChart('🎂 Age Distribution', [{_id:'Under 10',count:4},{_id:'10-13',count:7},{_id:'14-16',count:5},{_id:'17+',count:2}], '#0ea5e9')}
    </div>
    <div class="card-title" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:12px">📋 Student Directory</div>
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden">
      <table>
        <thead><tr><th>Student</th><th>Program</th><th>Home Group</th><th>Class</th><th>Background</th><th>XP</th></tr></thead>
        <tbody>
          ${STUDENTS.map(s=>`<tr>
            <td><div style="font-weight:600;color:#f1f5f9">${s.name}</div><div style="font-size:11px;color:#64748b;font-family:monospace">${s.id}</div></td>
            <td style="font-size:12px;color:#94a3b8">${s.program}</td>
            <td style="font-size:12px;color:#94a3b8">${s.house}</td>
            <td style="font-size:12px;color:#94a3b8">${s.class}</td>
            <td style="font-size:12px;color:#94a3b8">${s.bg}</td>
            <td style="font-weight:700;color:#a78bfa">${s.xp}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
init();
</script>
</body>
</html>

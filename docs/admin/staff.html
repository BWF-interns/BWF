<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BWF Admin — Staff Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/staff.css"/>
<style>
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#a78bfa)}
.kpi-card.flag::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.kpi-val{font-size:26px;font-weight:900;font-family:'Outfit',sans-serif;color:#f1f5f9;display:flex;align-items:baseline;gap:6px}
.kpi-sub{font-size:12px;font-weight:600;color:#94a3b8;font-family:'Inter',sans-serif}
.kpi-lbl{font-size:12px;color:#64748b;margin-top:4px}
.alert-banner{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);border-radius:12px;padding:16px;display:flex;align-items:flex-start;gap:14px;margin-bottom:24px}
.alert-icon{font-size:24px;line-height:1}
.alert-title{font-size:14px;font-weight:700;color:#f59e0b}
.alert-desc{font-size:12px;color:#fcd34d;margin-top:4px}
.type-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;background:rgba(255,255,255,0.1);color:#cbd5e1;text-transform:uppercase;letter-spacing:0.04em}
.role-badge{font-size:11px;font-weight:600;color:#a78bfa;background:rgba(139,92,246,0.15);padding:3px 10px;border-radius:20px}
.status-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.status-Active{background:rgba(16,185,129,0.15);color:#34d399}
.status-Departed{background:rgba(239,68,68,0.15);color:#f87171}
.overload{color:#ef4444;font-weight:700;background:rgba(239,68,68,0.15);padding:2px 6px;border-radius:6px;font-size:11px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">🌏</div><div class="logo-text"><h2>BWF Portal</h2><p style="font-size:10px;color:#a78bfa;font-weight:700;margin-top:2px">DEMO MODE</p></div></div>
    <div class="sidebar-staff"><div class="staff-card"><div class="staff-avatar" style="background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:13px;font-weight:800">RA</div><div class="staff-info"><h4>Ravi Admin</h4><p>Administrator</p></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="compliance.html" class="nav-link"><span class="nav-icon">🔒</span>DPDP Compliance</a>
      <a href="students.html"   class="nav-link"><span class="nav-icon">👩‍🎓</span>Student Census</a>
      <a href="staff.html"      class="nav-link active"><span class="nav-icon">👥</span>Staff Management</a>
      <a href="finance.html"    class="nav-link"><span class="nav-icon">💰</span>Finance</a>
      <a href="media.html"      class="nav-link"><span class="nav-icon">📸</span>Media Oversight</a>
    </nav>
    <div class="sidebar-bottom"><button class="logout-btn" onclick="window.location.href='../index.html'">🚪 Back to Portal</button></div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h1>👥 Staff Management</h1><p>Caseloads, certifications, and turnover ratio</p></div>
      <div class="topbar-right"><span style="font-size:12px;color:#a78bfa;background:rgba(99,102,241,0.1);padding:4px 12px;border-radius:20px">🧪 Demo Mode</span></div>
    </header>
    <div class="page-content fade-in" id="page-content"><div style="text-align:center;padding:60px;color:#64748b">Loading...</div></div>
  </div>
</div>
<script src="../js/demo-data.js"></script>
<script>
async function init() {
  const { data: d } = await DemoAPI.staff();
  
  document.getElementById('page-content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${d.active}</div><div class="kpi-lbl">Total Active Staff</div></div>
      <div class="kpi-card"><div class="kpi-val">${d.staffList.filter(s=>s.staffType==='Volunteer').length}</div><div class="kpi-lbl">Active Volunteers</div></div>
      <div class="kpi-card ${d.turnoverRatio>15?'flag':''}"><div class="kpi-val" style="color:${d.turnoverRatio>15?'#f87171':'#34d399'}">${d.turnoverRatio}%</div><div class="kpi-lbl">Annual Turnover Ratio</div></div>
    </div>
    ${d.expiringCerts.length > 0 ? `
    <div class="alert-banner">
      <div class="alert-icon">⚠️</div>
      <div><div class="alert-title">${d.expiringCerts.length} Staff Certification(s) Expiring Soon</div>
      <div class="alert-desc">${d.expiringCerts.map(c=>`<b>${c.staffName}</b>: ${c.cert} expires on ${c.expiryDate}`).join('<br>')}</div></div>
    </div>` : ''}
    <div class="card-title" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:12px">📋 Staff Directory & Caseload</div>
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden">
      <table>
        <thead><tr><th>Staff Member</th><th>Role</th><th>Home Group</th><th>Type</th><th>Caseload (Students)</th><th>Status</th></tr></thead>
        <tbody>
          ${d.staffList.map(s=>`<tr>
            <td><div style="font-weight:600;color:#f1f5f9">${s.name}</div><div style="font-size:11px;color:#64748b">${s.email}</div></td>
            <td><span class="role-badge">${s.role}</span></td>
            <td style="font-size:12px;color:#94a3b8">${s.homeGroup}</td>
            <td><span class="type-badge">${s.staffType}</span></td>
            <td>${s.caseloadSize > 0 ? 
              (s.caseloadSize > 15 ? `<span class="overload">${s.caseloadSize} ⚠️ High</span>` : `<span style="color:#94a3b8;font-size:13px;font-weight:600">${s.caseloadSize}</span>`) 
              : '<span style="color:#64748b;font-size:12px">N/A</span>'}
            </td>
            <td><span class="status-badge status-${s.status}">${s.status}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
init();
</script>
</body>
</html>

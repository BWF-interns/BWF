<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BWF Admin — DPDP Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/staff.css"/>
<style>
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#a78bfa)}
.kpi-card.flag::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.kpi-val{font-size:26px;font-weight:900;font-family:'Outfit',sans-serif;color:#f1f5f9}
.kpi-lbl{font-size:12px;color:#64748b;margin-top:4px}
.risk-banner{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:16px;display:flex;align-items:flex-start;gap:14px;margin-bottom:24px}
.risk-icon{font-size:24px;line-height:1}
.risk-title{font-size:14px;font-weight:700;color:#f87171}
.risk-desc{font-size:12px;color:#fca5a5;margin-top:4px}
.action-btn{background:rgba(99,102,241,0.15);color:#818cf8;border:1px solid rgba(99,102,241,0.3);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:background 0.2s}
.action-btn:hover{background:rgba(99,102,241,0.25)}
.action-btn:disabled{opacity:0.5;cursor:not-allowed}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">🌏</div><div class="logo-text"><h2>BWF Portal</h2><p style="font-size:10px;color:#a78bfa;font-weight:700;margin-top:2px">DEMO MODE</p></div></div>
    <div class="sidebar-staff"><div class="staff-card"><div class="staff-avatar" style="background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:13px;font-weight:800">RA</div><div class="staff-info"><h4>Ravi Admin</h4><p>Administrator</p></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="compliance.html" class="nav-link active"><span class="nav-icon">🔒</span>DPDP Compliance</a>
      <a href="students.html"   class="nav-link"><span class="nav-icon">👩‍🎓</span>Student Census</a>
      <a href="staff.html"      class="nav-link"><span class="nav-icon">👥</span>Staff Management</a>
      <a href="finance.html"    class="nav-link"><span class="nav-icon">💰</span>Finance</a>
      <a href="media.html"      class="nav-link"><span class="nav-icon">📸</span>Media Oversight</a>
    </nav>
    <div class="sidebar-bottom"><button class="logout-btn" onclick="window.location.href='../index.html'">🚪 Back to Portal</button></div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h1>🔒 DPDP Act Compliance</h1><p>Digital Personal Data Protection Act 2023 readiness</p></div>
      <div class="topbar-right"><span style="font-size:12px;color:#a78bfa;background:rgba(99,102,241,0.1);padding:4px 12px;border-radius:20px">🧪 Demo Mode</span></div>
    </header>
    <div class="page-content fade-in" id="page-content"><div style="text-align:center;padding:60px;color:#64748b">Loading...</div></div>
  </div>
</div>
<script src="../js/demo-data.js"></script>
<script>
let state = { students: [] };
async function init() {
  const { data: d } = await DemoAPI.compliance();
  state.students = d.students;
  render({ ...d, consentMissing: state.students.filter(s=>!s.guardianConsent).length, dpdpVerified: state.students.filter(s=>s.guardianConsent).length, retentionRisk: state.students.filter(s=>!s.guardianConsent).length });
}
function render(d) {
  const tableRows = state.students.map(s => `<tr>
    <td><div style="font-weight:600;color:#f1f5f9">${s.user.name}</div><div style="font-size:11px;color:#64748b;font-family:monospace">${s.studentId}</div></td>
    <td style="font-size:12px">${s.homeGroup}</td>
    <td style="font-size:12px">${s.bwfProgram}</td>
    <td>${s.guardianConsent 
      ? '<span style="font-size:11px;font-weight:600;color:#34d399;background:rgba(16,185,129,0.15);padding:3px 8px;border-radius:12px">✅ Verified</span>'
      : '<span style="font-size:11px;font-weight:600;color:#f87171;background:rgba(239,68,68,0.15);padding:3px 8px;border-radius:12px">❌ Missing</span>'}
    </td>
    <td style="font-size:12px;color:#64748b">${s.guardianConsent ? 'Offline Form' : '—'}</td>
    <td>${s.guardianConsent ? '<button class="action-btn" disabled>Recorded</button>' : `<button class="action-btn" onclick="markConsent('${s._id}')">Verify Now</button>`}</td>
  </tr>`).join('');

  document.getElementById('page-content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${d.total}</div><div class="kpi-lbl">Total Students</div></div>
      <div class="kpi-card flag"><div class="kpi-val" style="color:#f87171">${d.consentMissing}</div><div class="kpi-lbl">Consent Missing</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:#34d399">${d.dpdpVerified}</div><div class="kpi-lbl">DPDP Verified</div></div>
      <div class="kpi-card flag"><div class="kpi-val" style="color:#f97316">${d.retentionRisk}</div><div class="kpi-lbl">Retention Risk (>30d)</div></div>
    </div>
    ${d.retentionRisk > 0 ? `
    <div class="risk-banner">
      <div class="risk-icon">⚠️</div>
      <div><div class="risk-title">${d.retentionRisk} accounts pose a data retention risk</div><div class="risk-desc">Students joined more than 30 days ago without verifiable guardian consent. DPDP Act requires verifiable consent for processing child data. Consider data minimization or suspension.</div></div>
    </div>` : ''}
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden">
      <table>
        <thead><tr><th>Student</th><th>Home Group</th><th>Program</th><th>Consent Status</th><th>Method</th><th>Action</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}
window.markConsent = async (id) => {
  await DemoAPI.recordConsent(id);
  const s = state.students.find(st=>st._id===id);
  if(s) s.guardianConsent = true;
  render({ total: state.students.length, consentMissing: state.students.filter(s=>!s.guardianConsent).length, dpdpVerified: state.students.filter(s=>s.guardianConsent).length, retentionRisk: state.students.filter(s=>!s.guardianConsent).length });
};
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BWF Admin — Media Oversight</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/staff.css"/>
<style>
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#a78bfa)}
.kpi-card.flag::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.kpi-val{font-size:26px;font-weight:900;font-family:'Outfit',sans-serif;color:#f1f5f9;display:flex;align-items:baseline;gap:6px}
.kpi-lbl{font-size:12px;color:#64748b;margin-top:4px}
.tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:10px}
.tab{padding:8px 16px;border-radius:20px;background:transparent;color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s}
.tab:hover{color:#f1f5f9;background:rgba(255,255,255,0.04)}
.tab.active{background:rgba(99,102,241,0.15);color:#818cf8}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:30px}
.post-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;transition:transform 0.2s}
.post-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.15)}
.img-placeholder{height:160px;background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(167,139,250,0.1));display:flex;align-items:center;justify-content:center;font-size:40px;border-bottom:1px solid rgba(255,255,255,0.08)}
.post-body{padding:16px}
.post-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.post-author{font-size:13px;font-weight:600;color:#f1f5f9}
.post-house{font-size:11px;color:#a78bfa}
.post-date{font-size:11px;color:#64748b}
.post-caption{font-size:13px;color:#cbd5e1;line-height:1.5;margin-bottom:16px}
.check-list{list-style:none;margin-bottom:16px;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px}
.check-list li{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.check-list li.ok{color:#34d399}
.post-actions{display:flex;gap:8px}
.action-btn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all 0.2s}
.btn-approve{background:rgba(16,185,129,0.15);color:#34d399;border-color:rgba(16,185,129,0.3)}
.btn-approve:hover{background:rgba(16,185,129,0.25)}
.btn-reject{background:rgba(239,68,68,0.15);color:#f87171;border-color:rgba(239,68,68,0.3)}
.btn-reject:hover{background:rgba(239,68,68,0.25)}
.btn-hof{background:rgba(245,158,11,0.15);color:#f59e0b;border-color:rgba(245,158,11,0.3)}
.btn-hof:hover{background:rgba(245,158,11,0.25)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">🌏</div><div class="logo-text"><h2>BWF Portal</h2><p style="font-size:10px;color:#a78bfa;font-weight:700;margin-top:2px">DEMO MODE</p></div></div>
    <div class="sidebar-staff"><div class="staff-card"><div class="staff-avatar" style="background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:13px;font-weight:800">RA</div><div class="staff-info"><h4>Ravi Admin</h4><p>Administrator</p></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="compliance.html" class="nav-link"><span class="nav-icon">🔒</span>DPDP Compliance</a>
      <a href="students.html"   class="nav-link"><span class="nav-icon">👩‍🎓</span>Student Census</a>
      <a href="staff.html"      class="nav-link"><span class="nav-icon">👥</span>Staff Management</a>
      <a href="finance.html"    class="nav-link"><span class="nav-icon">💰</span>Finance</a>
      <a href="media.html"      class="nav-link active"><span class="nav-icon">📸</span>Media Oversight</a>
    </nav>
    <div class="sidebar-bottom"><button class="logout-btn" onclick="window.location.href='../index.html'">🚪 Back to Portal</button></div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h1>📸 Media Oversight</h1><p>Safeguarding check for student gallery uploads</p></div>
      <div class="topbar-right"><span style="font-size:12px;color:#a78bfa;background:rgba(99,102,241,0.1);padding:4px 12px;border-radius:20px">🧪 Demo Mode</span></div>
    </header>
    <div class="page-content fade-in" id="page-content"><div style="text-align:center;padding:60px;color:#64748b">Loading...</div></div>
  </div>
</div>
<script src="../js/demo-data.js"></script>
<script>
let P = { pending:[], approved:[], rejected:[] };
const emojis = ['🎨','🏕️','📚','⚽','🌱','🎭'];
function getRandomEmoji() { return emojis[Math.floor(Math.random()*emojis.length)]; }

async function init() {
  P = await DemoAPI.posts();
  renderTab('pending');
}

function getCardHTML(p, type) {
  return `
    <div class="post-card fade-in">
      <div class="img-placeholder">${getRandomEmoji()}</div>
      <div class="post-body">
        <div class="post-meta">
          <div><div class="post-author">${p.student}</div><div class="post-house">${p.house}</div></div>
          <div class="post-date">${p.date}</div>
        </div>
        <div class="post-caption">"${p.caption}"</div>
        <ul class="check-list">
          <li class="ok">✅ Face obfuscated / side profile</li>
          <li class="ok">✅ No location indicators</li>
          <li class="${type!=='rejected'?'ok':''}"> ${type!=='rejected'?'✅ Dignity maintained':'❌ Safeguarding concern'}</li>
        </ul>
        <div class="post-actions">
          ${type==='pending' ? `<button class="action-btn btn-approve" onclick="act(this, 'Approved')">Approve</button> <button class="action-btn btn-reject" onclick="act(this, 'Rejected')">Reject</button>` : ''}
          ${type==='approved' && !p.hof ? `<button class="action-btn btn-hof" onclick="act(this, 'Hall of Fame')">⭐ Add to Hall of Fame</button>` : ''}
          ${type==='approved' && p.hof ? `<div style="text-align:center;width:100%;font-size:12px;color:#f59e0b;font-weight:700">⭐ In Hall of Fame</div>` : ''}
          ${type==='rejected' ? `<div style="text-align:center;width:100%;font-size:12px;color:#ef4444;font-weight:700">❌ Rejected by System</div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderTab(tab) {
  const content = document.getElementById('page-content');
  const items = P[tab];
  const hofCount = P.approved.filter(p=>p.hof).length;
  
  content.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card ${P.pending.length>3?'flag':''}"><div class="kpi-val" style="color:${P.pending.length>0?'#f97316':'#34d399'}">${P.pending.length}</div><div class="kpi-lbl">Pending Review</div></div>
      <div class="kpi-card"><div class="kpi-val">${P.approved.length}</div><div class="kpi-lbl">Approved Posts</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:#f59e0b">${hofCount}</div><div class="kpi-lbl">Hall of Fame</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${tab==='pending'?'active':''}" onclick="renderTab('pending')">Pending Review (${P.pending.length})</button>
      <button class="tab ${tab==='approved'?'active':''}" onclick="renderTab('approved')">Approved & Live (${P.approved.length})</button>
      <button class="tab ${tab==='rejected'?'active':''}" onclick="renderTab('rejected')">Rejected (${P.rejected.length})</button>
    </div>
    <div class="media-grid">
      ${items.length ? items.map(p => getCardHTML(p, tab)).join('') : `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748b;font-size:14px">No ${tab} posts</div>`}
    </div>`;
}

window.act = (btn, action) => {
  btn.innerText = 'Doing...';
  setTimeout(() => { showStaffToast(action, 'Review logged locally'); btn.parentElement.parentElement.parentElement.style.opacity = '0.5'; }, 400);
};

init();
</script>
</body>
</html>

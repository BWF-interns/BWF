<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>BWF — Dean All Requests</title>
    <link rel="stylesheet" href="/css/staff.css" />
</head>

<body>
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">🌏</div>
                <div class="logo-text">
                    <h2>BWF Portal</h2><span class="staff-badge">Warden / Dean</span>
                </div>
            </div>
            <div class="sidebar-staff">
                <div class="staff-card">
                    <div class="staff-avatar" id="sb-staff-avatar">DN</div>
                    <div class="staff-info">
                        <h4 id="sb-staff-name">Loading...</h4>
                        <p id="sb-staff-role">Dean</p>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dean/dashboard" class="nav-link"><span class="nav-icon">📊</span> Analytics Dashboard</a>
                <a href="/dean/students" class="nav-link"><span class="nav-icon">👩‍🎓</span> All Students</a>
                <a href="/dean/requests" class="nav-link active"><span class="nav-icon">📋</span> All Requests</a>
                <a href="/dean/gallery" class="nav-link"><span class="nav-icon">📸</span> Gallery Moderation</a>
                <a href="/dean/notify" class="nav-link"><span class="nav-icon">📢</span> Broadcast</a>
            </nav>
            <div class="sidebar-bottom"><button class="logout-btn" onclick="staffLogout()"><span>🚪</span> Sign
                    Out</button></div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:14px">
                    <button class="hamburger" id="hamburger">☰</button>
                    <div class="topbar-left">
                        <h1>All Requests</h1>
                        <p id="req-subtitle">Loading...</p>
                    </div>
                </div>
            </header>

            <div class="page-content fade-in">
                <div class="filter-bar">
                    <select class="form-control" id="filter-status" style="width:auto">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="seen">Seen</option>
                        <option value="in_progress">In Progress</option>
                        <option value="fulfilled">Fulfilled</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <select class="form-control" id="filter-type" style="width:auto">
                        <option value="">All Types</option>
                        <option value="medicine">💊 Medicine</option>
                        <option value="food">🍽️ Food</option>
                        <option value="clothing">👕 Clothing</option>
                        <option value="stationery">📚 Stationery</option>
                        <option value="other">Other</option>
                    </select>
                    <select class="form-control" id="filter-urgency" style="width:auto">
                        <option value="">All Urgency</option>
                        <option value="urgent">🔴 Urgent</option>
                        <option value="high">🟠 High</option>
                        <option value="medium">🔵 Medium</option>
                        <option value="low">🟢 Low</option>
                    </select>
                </div>

                <div id="req-list">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal-overlay" id="status-modal">
        <div class="modal" style="position:relative">
            <div class="modal-title">Update Request Status</div>
            <div class="modal-subtitle" id="modal-req-title">—</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
            <input type="hidden" id="modal-req-id" />
            <div class="form-group">
                <label class="form-label">New Status</label>
                <select id="modal-status" class="form-control">
                    <option value="seen">👁 Seen</option>
                    <option value="in_progress">🔄 In Progress</option>
                    <option value="fulfilled">✅ Fulfilled</option>
                    <option value="rejected">❌ Rejected</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Note (added to audit trail)</label>
                <textarea id="modal-note" class="form-control"
                    placeholder="e.g. Medications collected from pharmacy and given to student..."></textarea>
            </div>
            <button class="btn btn-primary btn-block" onclick="doUpdate()">Update Status</button>
        </div>
    </div>

    <script src="/js/staff-api.js"></script>
    <script>
        requireDean();
        initStaffSidebar();
        const typeIcons = { medicine: '💊', food: '🍽️', clothing: '👕', stationery: '📚', other: '📦' };

        async function loadRequests() {
            const params = {};
            const st = document.getElementById('filter-status').value;
            const tp = document.getElementById('filter-type').value;
            const ug = document.getElementById('filter-urgency').value;
            if (st) params.status = st; if (tp) params.type = tp; if (ug) params.urgency = ug;
            try {
                const { data, total } = await StaffRequestsAPI.all(params);
                document.getElementById('req-subtitle').textContent = `${total} total requests across all houses`;
                document.getElementById('req-list').innerHTML = data.length ? data.map(r => `
      <div class="request-card ${r.urgency}">
        <div class="request-header">
          <div style="display:flex;align-items:center;gap:10px;flex:1">
            <span style="font-size:24px">${typeIcons[r.type] || '📦'}</span>
            <div>
              <div style="font-size:15px;font-weight:700;color:var(--text-primary)">${r.title}</div>
              <div style="font-size:12px;color:var(--text-muted)">${r.student?.user?.name || '--'} · ${r.student?.homeGroup || '--'} · ${timeAgo(r.createdAt)}</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${urgencyBadge(r.urgency)}${statusBadge(r.status)}
          </div>
        </div>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">${r.description}</p>
        ${r.adminNotes ? `<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-bottom:8px">📝 ${r.adminNotes}</div>` : ''}
        ${r.auditTrail?.length ? `<div class="audit-trail"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:6px">Audit Trail (last ${Math.min(3, r.auditTrail.length)} actions)</div>${r.auditTrail.slice(-3).map(a => `<div class="audit-entry"><div class="audit-dot"></div><div><span style="font-weight:600;text-transform:capitalize">${a.status?.replace('_', ' ')}</span>${a.note ? ' — ' + a.note : ''} <span style="color:var(--text-muted)">(${timeAgo(a.changedAt)})</span></div></div>`).join('')}</div>` : ''}
        <div style="display:flex;gap:8px;margin-top:12px">
          ${r.status !== 'fulfilled' && r.status !== 'rejected' ? `<button class="btn btn-primary btn-sm" onclick="openModal('${r._id}','${r.title.replace(/'/g, "\\'")}')">Update Status</button>` : ''}
          <a href="/housemother/student-detail?id=${r.student?._id}" class="btn btn-secondary btn-sm">View Student →</a>
        </div>
      </div>`).join('') : '<div class="empty-state"><span class="emoji">✅</span><h3>No requests found</h3></div>';
            } catch (e) { showStaffToast('Error', e.message, 'error'); }
        }

        function openModal(id, title) {
            document.getElementById('modal-req-id').value = id;
            document.getElementById('modal-req-title').textContent = title;
            document.getElementById('modal-note').value = '';
            document.getElementById('status-modal').classList.add('open');
        }
        function closeModal() { document.getElementById('status-modal').classList.remove('open'); }
        async function doUpdate() {
            const id = document.getElementById('modal-req-id').value;
            const status = document.getElementById('modal-status').value;
            const note = document.getElementById('modal-note').value;
            try {
                await StaffRequestsAPI.updateStatus(id, status, note);
                showStaffToast('Updated!', `Request marked as ${status}`, 'success');
                closeModal(); loadRequests();
            } catch (e) { showStaffToast('Error', e.message, 'error'); }
        }

        document.getElementById('status-modal').addEventListener('click', e => { if (e.target.id === 'status-modal') closeModal(); });
        ['filter-status', 'filter-type', 'filter-urgency'].forEach(id => document.getElementById(id).addEventListener('change', loadRequests));
        loadRequests();
    </script>
</body>

</html>

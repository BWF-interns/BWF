<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BWF — My Housemates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .student-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .student-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .student-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
        }

        .student-card:hover::before {
            opacity: 1;
        }

        .student-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: white;
            margin: 0 auto 14px;
            font-family: 'Outfit', sans-serif;
        }

        .student-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .student-class {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .student-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 4px;
        }

        .student-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .student-stat strong {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .badge-streak {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(245, 158, 11, 0.12);
            color: #f59e0b;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .badge-level {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(139, 92, 246, 0.12);
            color: var(--primary);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .self-card {
            border-color: var(--primary) !important;
        }

        .self-card::before {
            opacity: 1 !important;
        }

        .self-label {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            font-weight: 700;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            padding: 2px 7px;
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap input {
            padding-left: 38px;
        }

        .search-wrap .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 15px;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .empty-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-msg .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🌍</div>
                    <div class="logo-text"><span class="logo-bwf">BWF</span><span class="logo-subtitle">Student
                            Portal</span></div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item"><span class="nav-icon">🏠</span><span>Dashboard</span></a>
                <a href="/learning" class="nav-item"><span class="nav-icon">📚</span><span>Learning</span></a>
                <a href="/tasks" class="nav-item"><span class="nav-icon">✅</span><span>Tasks</span></a>
                <a href="/roadmap" class="nav-item"><span class="nav-icon">🗺️</span><span>My Roadmap</span></a>
                <a href="/leaderboard" class="nav-item"><span class="nav-icon">🏆</span><span>Leaderboard</span></a>
                <a href="/students" class="nav-item active"><span
                        class="nav-icon">👩‍🎓</span><span>Housemates</span></a>
                <a href="/gallery" class="nav-item"><span class="nav-icon">📸</span><span>Gallery</span></a>
                <a href="/requests" class="nav-item"><span class="nav-icon">📋</span><span>My Requests</span></a>
                <a href="/profile" class="nav-item"><span class="nav-icon">👤</span><span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" id="sidebar-user">
                    <div class="user-avatar" id="sidebar-avatar">ST</div>
                    <div class="user-details">
                        <div class="user-name" id="sidebar-name">Loading...</div>
                        <div class="user-role">Student</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Sign out">🚪</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <header class="page-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
                    <div>
                        <h1 class="page-title">👩‍🎓 Housemates</h1>
                        <p class="page-subtitle" id="subtitle">Your BWF family</p>
                    </div>
                </div>
                <div class="header-right">
                    <a href="/requests" class="btn btn-ghost" id="notif-btn">🔔</a>
                </div>
            </header>

            <div class="page-body">
                <!-- Filters -->
                <div class="filter-bar">
                    <div class="search-wrap" style="flex:1;min-width:200px">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="search-input" class="form-input" placeholder="Search by name..."
                            oninput="filter()" />
                    </div>
                    <select id="filter-class" class="form-input" style="width:auto" onchange="filter()">
                        <option value="">All Classes</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option>9th</option>
                        <option>10th</option>
                    </select>
                    <select id="filter-sort" class="form-input" style="width:auto" onchange="filter()">
                        <option value="xp">Sort by XP</option>
                        <option value="name">Sort by Name</option>
                        <option value="streak">Sort by Streak</option>
                    </select>
                </div>

                <!-- Grid -->
                <div id="students-grid" class="students-grid">
                    <!-- Loading -->
                    <div style="grid-column:1/-1;text-align:center;padding:60px">
                        <div class="spinner" style="margin:0 auto"></div>
                        <p style="margin-top:14px;color:var(--text-secondary)">Loading your housemates...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script>
        requireAuth();
        initSidebar();

        let allStudents = [];
        let myStudentId = null;

        async function load() {
            try {
                const me = TokenManager.getUser();
                const storedStudentId = TokenManager.getStudentId();

                // Fetch all students from API
                const res = await fetch('/api/students', { headers: { 'Authorization': `Bearer ${TokenManager.get()}` } });
                const json = await res.json();
                allStudents = json.data || json || [];

                // Find my own profile to highlight
                myStudentId = storedStudentId;

                document.getElementById('subtitle').textContent = `${allStudents.length} students in your BWF family`;
                render(allStudents);
            } catch (e) {
                document.getElementById('students-grid').innerHTML = `<div class="empty-msg" style="grid-column:1/-1"><span class="emoji">😔</span><p>${e.message}</p></div>`;
            }
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function render(students) {
            if (!students.length) {
                document.getElementById('students-grid').innerHTML = `<div class="empty-msg" style="grid-column:1/-1"><span class="emoji">🔍</span><h3>No students found</h3></div>`;
                return;
            }

            document.getElementById('students-grid').innerHTML = students.map(s => {
                const isSelf = s._id === myStudentId || s.studentId === myStudentId;
                return `
      <div class="student-card ${isSelf ? 'self-card' : ''}" onclick="window.location.href='/leaderboard'">
        ${isSelf ? '<div class="self-label">You ✨</div>' : ''}
        <div class="student-avatar">${getInitials(s.user?.name)}</div>
        <div class="student-name">${s.user?.name || '—'}</div>
        <div class="student-class">${s.education?.currentClass ? s.education.currentClass + ' Class' : 'BWF Student'} ${s.homeGroup ? '· ' + s.homeGroup : ''}</div>
        <div>
          ${s.streak > 0 ? `<span class="badge-streak">🔥 ${s.streak}d streak</span>` : ''}
          <span class="badge-level">⭐ Level ${s.level || 1}</span>
        </div>
        ${s.careerGoal ? `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-style:italic">"${s.careerGoal}"</div>` : ''}
        <div class="student-stats">
          <div class="student-stat"><strong>${s.totalPoints || 0}</strong><span>XP</span></div>
          <div class="student-stat"><strong>${s.streak || 0}</strong><span>Streak</span></div>
          <div class="student-stat"><strong>${s.education?.currentClass || '—'}</strong><span>Class</span></div>
        </div>
      </div>
    `;
            }).join('');
        }

        function filter() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const cls = document.getElementById('filter-class').value;
            const sort = document.getElementById('filter-sort').value;

            let filtered = allStudents.filter(s => {
                const nameMatch = !search || s.user?.name?.toLowerCase().includes(search);
                const classMatch = !cls || s.education?.currentClass === cls;
                return nameMatch && classMatch;
            });

            if (sort === 'xp') filtered.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));
            else if (sort === 'name') filtered.sort((a, b) => (a.user?.name || '').localeCompare(b.user?.name || ''));
            else if (sort === 'streak') filtered.sort((a, b) => (b.streak || 0) - (a.streak || 0));

            render(filtered);
        }

        function logout() {
            TokenManager.clear();
            window.location.href = '/';
        }

        load();
    </script>
</body>

</html>

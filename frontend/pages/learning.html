<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BWF — Learning Hub</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .category-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .cat-tab {
            padding: 8px 18px;
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border);
            background: var(--bg-card);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }

        .cat-tab.active,
        .cat-tab:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(108, 99, 255, 0.1);
        }

        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition-spring);
            cursor: pointer;
        }

        .topic-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-light);
        }

        .topic-header {
            padding: 20px;
        }

        .topic-emoji {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .topic-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .topic-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .topic-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topic-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Topic Detail */
        .resource-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            text-decoration: none;
            transition: var(--transition);
            border: 1px solid var(--border);
        }

        .resource-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .resource-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .resource-icon.youtube {
            background: rgba(239, 68, 68, 0.15);
        }

        .resource-icon.blog {
            background: rgba(59, 130, 246, 0.15);
        }

        .resource-icon.documentation {
            background: rgba(16, 185, 129, 0.15);
        }

        /* Quiz */
        .quiz-option {
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            margin-bottom: 8px;
        }

        .quiz-option:hover {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.08);
        }

        .quiz-option.selected {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.15);
            color: var(--primary-light);
        }

        .quiz-option.correct {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            color: #34D399;
        }

        .quiz-option.wrong {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
            color: #FCA5A5;
        }

        .explanation-box {
            padding: 14px;
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-top: 12px;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--border);
        }

        .progress-dot.done {
            background: var(--primary);
            border-color: var(--primary);
        }

        .progress-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">🌏</div>
                <div class="logo-text">
                    <h2>BWF Portal</h2>
                    <p>Learning Hub</p>
                </div>
            </div>
            <div class="sidebar-profile">
                <div class="student-card">
                    <div class="student-avatar" id="sb-avatar">--</div>
                    <div class="student-info">
                        <h4 id="sb-name">Loading...</h4>
                        <p id="sb-class">--</p>
                        <div class="student-badge" id="sb-level">⭐ Level 1</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Main</div>
                <a href="/dashboard" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
                <a href="/profile" class="nav-link"><span class="nav-icon">👩‍🎓</span> My Profile</a>
                <a href="/tasks" class="nav-link"><span class="nav-icon">✅</span> Daily Tasks</a>
                <div class="nav-section-label">Learn & Grow</div>
                <a href="/learning" class="nav-link active"><span class="nav-icon">🎮</span> Learning Hub</a>
                <a href="/roadmap" class="nav-link"><span class="nav-icon">🗺️</span> Career Roadmap</a>
                <a href="/leaderboard" class="nav-link"><span class="nav-icon">🏆</span> Leaderboard</a>
                <div class="nav-section-label">Community</div>
                <a href="/gallery" class="nav-link"><span class="nav-icon">📸</span> Gallery &amp; Hall of Fame</a>
                <a href="/requests" class="nav-link"><span class="nav-icon">📋</span> My Requests</a>
            </nav>
            <div class="sidebar-bottom"><button class="logout-btn" onclick="AuthAPI.logout()"><span>🚪</span> Sign
                    Out</button></div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:14px">
                    <button class="hamburger" id="hamburger">☰</button>
                    <div class="topbar-left">
                        <h1>🎮 Learning Hub</h1>
                        <p>Earn XP by completing topics and quizzes!</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="level-badge" id="points-display">⭐ 0 XP</div>
                    <span class="streak-badge" id="streak-badge">🔥 0 day streak</span>
                </div>
            </header>

            <div class="page-content fade-in" id="topics-page">
                <div class="category-tabs" id="cat-tabs">
                    <button class="cat-tab active" onclick="filterTopics('')">All Topics</button>
                </div>
                <div class="grid-3" id="topics-grid">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Topic Detail Modal -->
    <div class="modal-overlay" id="topic-modal">
        <div class="modal" style="max-width:640px;position:relative">
            <button class="modal-close" onclick="closeTopicModal()">✕</button>
            <div id="topic-modal-content"></div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div class="modal-overlay" id="quiz-modal">
        <div class="modal" style="max-width:600px;position:relative">
            <button class="modal-close" onclick="closeQuizModal()">✕</button>
            <div id="quiz-content"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        requireStudent();
        initSidebar();

        let allTopics = [];
        let currentTopicId = null;
        let questions = [];
        let userAnswers = {};
        let quizSubmitted = false;

        const categories = ['Technology', 'AI & Machine Learning', 'Languages', 'Science', 'Arts & Crafts', 'Mathematics', 'Life Skills', 'Environment'];

        async function init() {
            try {
                const studentRes = await StudentsAPI.me();
                const s = studentRes.data;
                const user = TokenManager.getUser();
                document.getElementById('sb-avatar').textContent = getInitials(user.name);
                document.getElementById('sb-name').textContent = user.name;
                document.getElementById('sb-class').textContent = `${s.education?.currentClass || '--'} Class`;
                document.getElementById('sb-level').textContent = `⭐ Level ${getLevel(s.totalPoints)}`;
                document.getElementById('points-display').textContent = `⭐ ${s.totalPoints} XP`;
                document.getElementById('streak-badge').textContent = `🔥 ${s.streak} day streak`;
            } catch (e) { }

            // Category tabs
            const tabsEl = document.getElementById('cat-tabs');
            categories.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'cat-tab';
                btn.textContent = c;
                btn.onclick = () => filterTopics(c);
                tabsEl.appendChild(btn);
            });

            await loadTopics();
        }

        async function loadTopics(category = '') {
            try {
                const res = await TopicsAPI.list(category);
                allTopics = res.data;
                renderTopics(allTopics);
            } catch (e) { document.getElementById('topics-grid').innerHTML = '<div class="empty-state"><span class="emoji">😕</span><h3>Could not load topics</h3></div>'; }
        }

        function filterTopics(cat) {
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = cat ? allTopics.filter(t => t.category === cat) : allTopics;
            renderTopics(filtered);
        }

        function renderTopics(topics) {
            const statusColors = { completed: 'badge-green', in_progress: 'badge-purple', not_started: 'badge-blue', null: 'badge-blue' };
            const statusText = { completed: '✓ Completed', in_progress: '▶ In Progress', not_started: '🔵 Start', null: '🔵 Start' };
            document.getElementById('topics-grid').innerHTML = topics.map(t => {
                const st = t.progress?.status || null;
                return `
        <div class="topic-card" onclick="openTopic('${t._id}')">
          <div class="topic-header">
            <div class="topic-emoji">${t.icon}</div>
            <div class="topic-title">${t.title}</div>
            <div class="topic-desc">${t.description}</div>
          </div>
          <div class="topic-footer">
            <div>
              <span class="badge ${statusColors[st] || 'badge-blue'}">${statusText[st] || '🔵 Start'}</span>
              <div class="topic-meta" style="margin-top:6px">⏱ ${t.estimatedTime} · +${t.pointsReward} XP</div>
            </div>
            <span class="badge badge-gold" style="font-size:10px">${t.difficulty}</span>
          </div>
        </div>`;
            }).join('') || '<div class="empty-state" style="grid-column:1/-1"><span class="emoji">📚</span><h3>No topics in this category yet</h3><p>Check back soon!</p></div>';
        }

        async function openTopic(id) {
            currentTopicId = id;
            document.getElementById('topic-modal').classList.add('open');
            document.getElementById('topic-modal-content').innerHTML = '<div class="spinner"></div>';
            try {
                const res = await TopicsAPI.get(id);
                const t = res.data;
                const resourceIcons = { youtube: '▶️', blog: '📖', documentation: '📄', article: '📰' };
                document.getElementById('topic-modal-content').innerHTML = `
        <div style="font-size:48px;margin-bottom:12px">${t.icon}</div>
        <div class="modal-title">${t.title}</div>
        <div class="modal-subtitle">${t.description}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
          <span class="badge badge-purple">${t.category}</span>
          <span class="badge badge-gold">${t.difficulty}</span>
          <span class="badge badge-green">⏱ ${t.estimatedTime}</span>
          <span class="badge badge-blue">+${t.pointsReward} XP</span>
        </div>
        <div class="divider"></div>
        <div style="font-weight:700;margin-bottom:12px">📚 Learning Resources</div>
        ${t.resources.map(r => `
          <a href="${r.url}" target="_blank" rel="noopener" class="resource-item" style="color:inherit">
            <div class="resource-icon ${r.type}">${resourceIcons[r.type] || '🔗'}</div>
            <div>
              <div style="font-size:14px;font-weight:600">${r.title}</div>
              <div style="font-size:12px;color:var(--text-muted)">${r.description || ''}${r.duration ? ' · ' + r.duration : ''}</div>
            </div>
            <span style="margin-left:auto;font-size:18px;color:var(--text-muted)">↗</span>
          </a>`).join('')}
        <div class="divider"></div>
        <button class="btn btn-primary btn-lg btn-block" onclick="startQuiz('${t._id}')">
          🧠 Take the Quiz — Earn XP!
        </button>
      `;
            } catch (e) { document.getElementById('topic-modal-content').innerHTML = '<div class="empty-state"><span class="emoji">😕</span><h3>Could not load topic</h3></div>'; }
        }

        function closeTopicModal() { document.getElementById('topic-modal').classList.remove('open'); }
        document.getElementById('topic-modal').addEventListener('click', e => { if (e.target.id === 'topic-modal') closeTopicModal(); });

        async function startQuiz(topicId) {
            closeTopicModal();
            userAnswers = {}; quizSubmitted = false;
            currentTopicId = topicId;
            document.getElementById('quiz-modal').classList.add('open');
            document.getElementById('quiz-content').innerHTML = '<div class="spinner"></div>';
            try {
                const res = await TopicsAPI.getQuestions(topicId);
                questions = res.data;
                if (questions.length === 0) {
                    document.getElementById('quiz-content').innerHTML = '<div class="empty-state"><span class="emoji">📝</span><h3>No quiz yet</h3><p>Questions coming soon!</p></div>';
                    return;
                }
                renderQuiz();
            } catch (e) { }
        }

        function renderQuiz() {
            const q = questions[0]; // show one at a time or all
            document.getElementById('quiz-content').innerHTML = `
      <div class="modal-title">🧠 Quick Quiz</div>
      <div class="modal-subtitle">Answer all questions to earn your XP!</div>
      <div id="questions-container">
        ${questions.map((q, qi) => `
          <div style="margin-bottom:24px;padding:18px;background:var(--bg-surface);border-radius:var(--radius-md);border:1px solid var(--border)" id="q-block-${qi}">
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Question ${qi + 1} of ${questions.length}</div>
            <div style="font-size:16px;font-weight:700;margin-bottom:16px">${q.question}</div>
            <div id="opts-${qi}">
              ${q.options.map((opt, oi) => `
                <div class="quiz-option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">${opt.text}</div>
              `).join('')}
            </div>
            <div id="explanation-${qi}" style="display:none" class="explanation-box"></div>
          </div>`).join('')}
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="submit-quiz-btn" onclick="submitQuiz()">
        Submit Answers 🚀
      </button>
      <div id="quiz-result" style="display:none;margin-top:16px;text-align:center"></div>
    `;
        }

        function selectOption(qi, oi) {
            if (quizSubmitted) return;
            userAnswers[qi] = oi;
            document.querySelectorAll(`#opts-${qi} .quiz-option`).forEach((el, i) => {
                el.classList.toggle('selected', i === oi);
            });
        }

        async function submitQuiz() {
            if (quizSubmitted) return;
            if (Object.keys(userAnswers).length < questions.length) {
                showToast('Answer all questions', 'Please answer every question before submitting!', 'warning');
                return;
            }
            document.getElementById('submit-quiz-btn').disabled = true;
            const answers = questions.map((q, qi) => ({ questionId: q._id, selectedOptionIndex: userAnswers[qi] }));
            try {
                const res = await TopicsAPI.submitQuiz(currentTopicId, answers);
                quizSubmitted = true;

                res.results.forEach((r, qi) => {
                    const correctIdx = r.correctIndex;
                    document.querySelectorAll(`#opts-${qi} .quiz-option`).forEach((el, oi) => {
                        el.classList.remove('selected');
                        if (oi === correctIdx) el.classList.add('correct');
                        else if (oi === userAnswers[qi] && !r.correct) el.classList.add('wrong');
                    });
                    if (r.explanation) {
                        const expEl = document.getElementById(`explanation-${qi}`);
                        expEl.style.display = 'block';
                        expEl.innerHTML = `💡 ${r.explanation}`;
                    }
                });

                const allCorrect = res.correctAnswers === res.totalQuestions;
                document.getElementById('quiz-result').style.display = 'block';
                document.getElementById('quiz-result').innerHTML = `
        <div style="font-size:48px;margin-bottom:8px">${allCorrect ? '🎉' : res.correctAnswers >= res.totalQuestions / 2 ? '😊' : '😕'}</div>
        <div style="font-size:20px;font-weight:800">${res.correctAnswers}/${res.totalQuestions} Correct!</div>
        <div style="color:var(--secondary);font-size:18px;font-weight:700;margin-top:4px">+${res.pointsEarned} XP Earned!</div>
        ${allCorrect ? '<div style="color:var(--accent-green);font-size:14px;margin-top:4px">🔥 Perfect score! Bonus XP awarded!</div>' : ''}
        <button class="btn btn-secondary btn-sm" style="margin-top:16px" onclick="closeQuizModal()">Continue Learning →</button>
      `;

                showToast(`+${res.pointsEarned} XP!`, `${res.correctAnswers}/${res.totalQuestions} correct answers 🎉`, 'success');
                await loadTopics();
            } catch (e) { showToast('Error', e.message, 'error'); document.getElementById('submit-quiz-btn').disabled = false; }
        }

        function closeQuizModal() { document.getElementById('quiz-modal').classList.remove('open'); }
        document.getElementById('quiz-modal').addEventListener('click', e => { if (e.target.id === 'quiz-modal') closeQuizModal(); });

        init();
    </script>
</body>

</html>

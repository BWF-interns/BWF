<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>BWF — My Students</title>
    <link rel="stylesheet" href="/css/staff.css" />
</head>

<body>
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">🌏</div>
                <div class="logo-text">
                    <h2>BWF Portal</h2><span class="staff-badge">Housemother</span>
                </div>
            </div>
            <div class="sidebar-staff">
                <div class="staff-card">
                    <div class="staff-avatar" id="sb-staff-avatar">HM</div>
                    <div class="staff-info">
                        <h4 id="sb-staff-name">Loading...</h4>
                        <p id="sb-staff-role">Housemother</p>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Overview</div>
                <a href="/housemother/dashboard" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
                <div class="nav-section-label">Care</div>
                <a href="/housemother/students" class="nav-link active"><span class="nav-icon">👩‍🎓</span> My
                    Students</a>
                <a href="/housemother/requests" class="nav-link"><span class="nav-icon">📋</span> Requests</a>
                <a href="/housemother/gallery" class="nav-link"><span class="nav-icon">📸</span> Gallery Review</a>
                <div class="nav-section-label">Communication</div>
                <a href="/housemother/notify" class="nav-link"><span class="nav-icon">📢</span> Send Notification</a>
            </nav>
            <div class="sidebar-bottom"><button class="logout-btn" onclick="staffLogout()"><span>🚪</span> Sign
                    Out</button></div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:14px">
                    <button class="hamburger" id="hamburger">☰</button>
                    <div class="topbar-left">
                        <h1>My Students</h1>
                        <p id="student-count">Loading...</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="search-bar" style="min-width:220px">
                        <span>🔍</span><input type="text" id="search-input" placeholder="Search by name..." />
                    </div>
                </div>
            </header>

            <div class="page-content fade-in">
                <div class="filter-bar">
                    <select class="form-control" id="filter-streak" style="width:auto">
                        <option value="">All Streaks</option>
                        <option value="0">Broken Streak (0)</option>
                        <option value="active">Active Streak</option>
                    </select>
                    <select class="form-control" id="filter-class" style="width:auto">
                        <option value="">All Classes</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option>9th</option>
                        <option>10th</option>
                    </select>
                </div>

                <div class="card">
                    <div id="students-table">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/staff-api.js"></script>
    <script>
        requireHousemother();
        initStaffSidebar();

        let allStudents = [];

        async function loadStudents() {
            try {
                const { data } = await StaffStudentsAPI.list({ limit: 100 });
                allStudents = data;
                document.getElementById('student-count').textContent = `${data.length} students in your care`;
                renderTable(data);
            } catch (e) { showStaffToast('Error', e.message, 'error'); }
        }

        function renderTable(students) {
            if (!students.length) {
                document.getElementById('students-table').innerHTML = '<div class="empty-state"><span class="emoji">👩‍🎓</span><h3>No students found</h3></div>';
                return;
            }
            document.getElementById('students-table').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Student</th><th>Class</th><th>Career Goal</th><th>XP</th><th>Streak</th><th>Consent</th><th>Action</th></tr></thead>
        <tbody>
          ${students.map(s => `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px">
                  <div class="avatar-placeholder" style="width:36px;height:36px;font-size:12px">${getInitialsStaff(s.user?.name)}</div>
                  <div>
                    <div style="font-size:14px;font-weight:600;color:var(--text-primary)">${s.user?.name || '--'}</div>
                    <div style="font-size:11px;color:var(--text-muted)">${s.studentId || '--'} · ${s.homeGroup || '--'}</div>
                  </div>
                </div>
              </td>
              <td>${s.education?.currentClass || '--'}</td>
              <td style="font-size:13px">${s.careerGoal || '<span style="color:var(--text-muted)">Not set</span>'}</td>
              <td><strong>${s.totalPoints || 0}</strong> <span style="font-size:11px;color:var(--text-muted)">XP</span></td>
              <td>
                ${s.streak > 0 ? `<span class="badge badge-green">🔥 ${s.streak} days</span>` : '<span class="badge badge-red">🔴 Broken</span>'}
              </td>
              <td>
                ${s.guardianConsent ? '<span class="badge badge-green">✅ Given</span>' : '<span class="badge badge-red">⚠️ Missing</span>'}
              </td>
              <td><a href="/housemother/student-detail?id=${s._id}" class="btn btn-secondary btn-sm">View →</a></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const streak = document.getElementById('filter-streak').value;
            const cls = document.getElementById('filter-class').value;
            let filtered = allStudents.filter(s => {
                const nameMatch = !search || s.user?.name?.toLowerCase().includes(search);
                const streakMatch = !streak || (streak === '0' ? s.streak === 0 : s.streak > 0);
                const classMatch = !cls || s.education?.currentClass === cls;
                return nameMatch && streakMatch && classMatch;
            });
            renderTable(filtered);
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('filter-streak').addEventListener('change', applyFilters);
        document.getElementById('filter-class').addEventListener('change', applyFilters);

        loadStudents();
    </script>
</body>

</html>
